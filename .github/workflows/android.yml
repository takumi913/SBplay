name: Build CS11 APK

# SBplay: builds the only deliverable of this repo - an APK for the Lynk & Co CS11 head unit
# (cs11_19a_h, Android 4.4.3 / API 19, 32-bit ARM). minSdk = targetSdk = 19, armeabi-v7a only.
#
# - push / pull_request / manual run: build + verify + tests + lint; the APK is a workflow artifact.
# - release published: the same build, then the APK (and its SHA-256) is attached to that release,
#   and an empty release description is filled with install info + auto-generated "What's Changed".
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py

      # JDK 21 is what the project documents (docs/BUILD.md); gradle.properties forbids toolchain auto-download.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NDK r25c is the newest NDK that still supports API 19 (r26+ rejects minSdk 19);
      # cmake 3.22.1 is pinned in shared/build.gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37.0
            build-tools;36.0.0
            ndk;25.2.9519653
            cmake;3.22.1

      # The committed wrapper points at a China-only mirror that GitHub runners cannot always reach.
      # Same distribution, same distributionSha256Sum - only the download host changes (CI only).
      - name: Use the official Gradle distribution host
        run: sed -i 's#https\\://mirrors.cloud.tencent.com/gradle/#https\\://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties && grep distributionUrl gradle/wrapper/gradle-wrapper.properties

      - uses: gradle/actions/setup-gradle@v4

      # 1) The deliverable. assembleStandaloneDebug = committed identity + debug-signed APK
      #    (AGP adds the v1/JAR signature because minSdk < 24; Android 4.4 cannot verify v2 only).
      - name: Build standalone APK (API 19, armeabi-v7a)
        run: ./gradlew :mobile:clean :mobile:assembleStandaloneDebug --stacktrace

      - name: Verify the APK is installable on API 19
        run: |
          set -euo pipefail
          APK=mobile/build/outputs/apk/debug/mobile-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          test -f "$APK"
          "$BT/aapt2" dump badging "$APK" | tee badging.txt | grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|native-code)"
          # aapt2 prints the minimum as "minSdkVersion" (newer) or "sdkVersion" (older).
          grep -Eq "^(min)?[sS]dkVersion:'19'" badging.txt
          grep -q "^targetSdkVersion:'19'" badging.txt
          # armeabi-v7a is the only ABI: any other would be dead weight (or a mismatch) on a 32-bit head unit.
          grep -q "^native-code: 'armeabi-v7a'$" badging.txt
          # Version source of truth is Gradle; published tags must match the actual APK manifest.
          APK_VERSION=$(sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p" badging.txt | head -n 1)
          GRADLE_VERSION=$(sed -n 's/^[[:space:]]*versionName = "\\([^"]*\\)"/\\1/p' mobile/build.gradle.kts | head -n 1)
          test -n "$APK_VERSION" && test "$APK_VERSION" = "$GRADLE_VERSION" || {
            echo "APK version '$APK_VERSION' does not match Gradle '$GRADLE_VERSION'"; exit 1;
          }
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$APK_VERSION" || {
              echo "Release tag '$GITHUB_REF_NAME' does not match APK version '$APK_VERSION'"; exit 1;
            }
          fi
          "$BT/apksigner" verify --verbose --min-sdk-version 19 --max-sdk-version 19 "$APK" | tee signer.txt
          grep -q "Verified using v1 scheme (JAR signing): true" signer.txt
          unzip -l "$APK" | grep -q "assets/offline-mfi/identity.pk8"
          unzip -l "$APK" | grep -q "assets/offline-mfi/certificate.p7b"
          ls -l "$APK"
          NAME="SBplay-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          cp "$APK" "$NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBplay-CS11-API19-apk
          path: SBplay-*.apk
          if-no-files-found: error
          retention-days: 30

      # 2) Gates. Compiling and unit tests prove the code is correct, not that it works on the car.
      - name: Unit tests (shared + common)
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest --rerun-tasks --stacktrace

      - name: Lint (NewApi blocks the build)
        run: ./gradlew :shared:lintDebug :common:lintDebug :mobile:lintDebug --stacktrace

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            shared/build/reports/tests/
            common/build/reports/tests/
            shared/build/reports/lint-results-debug.html
            common/build/reports/lint-results-debug.html
            mobile/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # Only for published releases, and only after the build, verification, tests and lint above all passed.
  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # attach assets / edit the release description
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SBplay-CS11-API19-apk
          path: dist

      - name: Name the asset after the release tag
        run: |
          set -euo pipefail
          SRC=$(ls dist/*.apk)
          # e.g. SBplay-v0.2.23.apk ; slashes are not valid in asset names
          ASSET="SBplay-${TAG//\//-}.apk"
          mv "$SRC" "dist/$ASSET"
          (cd dist && sha256sum "$ASSET" | tee "$ASSET.sha256")
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload APK and checksum to the release
        run: gh release upload "$TAG" "dist/$ASSET" "dist/$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"

      # Never overwrite notes a human wrote: only an empty description is filled in.
      - name: Fill in release notes when the description is empty
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "Release already has a description - leaving it as is."
            exit 0
          fi
          # "What's Changed" grouped by .github/release.yml, like most open-source projects
          # (PR list, new contributors, full-changelog compare link).
          GENERATED=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body)
          SUM=$(cut -d' ' -f1 "dist/$ASSET.sha256")
          {
            echo "## 安装 / Install"
            echo
            echo "- **目标设备 / Target**：领克 CS11 车机（\`cs11_19a_h\`，Android 4.4.3 / API 19，32 位 ARM）。只面向该车机，不保证其它设备可安装或可用。"
            echo "- 下载 / Download：\`$ASSET\`"
            echo "- 安装 / Install：\`adb install -r $ASSET\`（覆盖安装即可，**不要先卸载**，以保留已有设置）。"
            echo "- SHA-256：\`$SUM\`"
            echo "- 包名 / Package：\`com.shihab.diplay.hudtest\`（debug 签名；更换签名后无法覆盖安装旧版）。"
            echo
            echo "> ⚠️ CI 只证明可编译、APK 格式正确（minSdk 19 / targetSdk 19 / armeabi-v7a / v1 签名）、单测与 lint 通过，**不证明车上可用**。功能须在 CS11 实机验证。"
            echo
            echo "$GENERATED"
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
