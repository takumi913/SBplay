# Categories for GitHub's auto-generated "What's Changed" release notes
# (https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes).
# PRs are grouped by label; commits made without a PR are listed by the generator as usual.
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
  categories:
    - title: 💥 Breaking Changes
      labels: [breaking-change]
    - title: ✨ New Features
      labels: [feature, enhancement]
    - title: 🐛 Bug Fixes
      labels: [bug, fix]
    - title: ⚡ Performance
      labels: [performance]
    - title: 🚗 CS11 / API 19 Compatibility
      labels: [api19, cs11]
    - title: 🛠 CI & Build
      labels: [ci, build]
    - title: 📚 Documentation
      labels: [documentation, docs]
    - title: 🔧 Maintenance
      labels: [chore, refactor, test, dependencies]
    - title: Other Changes
      labels: ['*']
